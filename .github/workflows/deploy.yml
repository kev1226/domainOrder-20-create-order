name: Build & Deploy create-order to EC2

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Push to DockerHub and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set deployment variables
        id: set-vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "env=QA" >> $GITHUB_OUTPUT
            echo "tag=qa-latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event.pull_request.base.ref }}" == "main" ]]; then
            echo "env=PROD" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t kalemat/20-create-order:${{ steps.set-vars.outputs.tag }} .

      - name: Push Docker image to Docker Hub
        run: |
          docker push kalemat/20-create-order:${{ steps.set-vars.outputs.tag }}

      - name: Connect and deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[format('EC2_HOST_{0}', steps.set-vars.outputs.env)] }}
          username: ${{ secrets[format('EC2_USER_{0}', steps.set-vars.outputs.env)] }}
          key: ${{ secrets[format('EC2_KEY_{0}', steps.set-vars.outputs.env)] }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script: |
            echo "Generating .env file..."
            echo "PORT=3050" > .env
            echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" >> .env
            echo "DB_NAME=orders_db" >> .env
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
            echo "CART_SERVICE_URL=${{ secrets.CART_SERVICE_URL }}" >> .env
            echo "CLEAR_CART_URL=${{ secrets.CLEAR_CART_URL }}" >> .env

            echo "Stopping previous container if exists..."
            docker stop 20-create-order || true
            docker rm 20-create-order || true

            echo "Pulling new image from Docker Hub..."
            docker pull kalemat/20-create-order:${{ steps.set-vars.outputs.tag }}

            echo "Starting container on port 3050..."
            docker run -d \
              --name 20-create-order \
              --restart always \
              --env-file .env \
              -p 3050:3050 \
              kalemat/20-create-order:${{ steps.set-vars.outputs.tag }}

            echo "Deployment completed."
